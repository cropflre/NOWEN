name: Clean up bookmark pagination integration

on:
  push:
    branches:
      - feat/bookmark-list-pagination

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/bookmark-list-pagination

      - name: Remove obsolete view-mode plumbing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          source = path.read_text(encoding='utf-8')

          replacements = [
              ('                  onViewModeChange={handleCardViewModeChange}\n', ''),
              ('  onViewModeChange,\n', ''),
              ("  onViewModeChange?: (mode: 'compact' | 'standard' | 'comfortable') => void;\n", ''),
              ('        {onViewModeChange ? null : null}\n', ''),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one App.tsx match, found {source.count(old)}: {old!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run pagination tests
        run: npm run test:run -- src/components/ui/__tests__/pagination.test.tsx

      - name: Build frontend
        run: npm run build

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --check
          git commit -m "refactor(ui): clean pagination integration"
          git push origin HEAD:feat/bookmark-list-pagination

# This workflow is temporary and will be removed after validation.
