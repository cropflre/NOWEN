name: Apply bookmark pagination

on:
  push:
    branches:
      - feat/bookmark-list-pagination

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/bookmark-list-pagination

      - name: Apply App pagination integration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          source = path.read_text(encoding='utf-8')

          old_icons = "  ChevronDown,\n  ChevronUp,\n"
          if old_icons not in source:
              raise SystemExit('Expected legacy expand/collapse icon imports were not found')
          source = source.replace(old_icons, '', 1)

          sidebar_import = 'import { SidebarNav } from "./components/ui/sidebar-nav";\n'
          pagination_import = 'import { Pagination } from "./components/ui/pagination";\n'
          if pagination_import not in source:
              if sidebar_import not in source:
                  raise SystemExit('SidebarNav import anchor was not found')
              source = source.replace(sidebar_import, sidebar_import + pagination_import, 1)

          call_anchor = "                  initialShowCount={categoryInitialShowCount}\n                  cardViewMode={cardViewMode}"
          call_replacement = "                  initialShowCount={categoryInitialShowCount}\n                  paginationKey={activeTag || 'all'}\n                  cardViewMode={cardViewMode}"
          if call_anchor not in source:
              raise SystemExit('CategorySection call anchor was not found')
          source = source.replace(call_anchor, call_replacement, 1)

          section_marker = '// ========== 分类区组件（支持折叠展开 + 懒渲染） =========='
          export_marker = '\nexport default App;'
          start = source.find(section_marker)
          end = source.find(export_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('CategorySection replacement markers were not found')

          new_section = r'''// ========== 分类区组件（支持分页 + 懒渲染） ==========
          function CategorySection({
            category,
            categoryBookmarks,
            catIndex,
            isLiteMode,
            isInternal,
            totalBookmarkCount,
            collapseThreshold,
            initialShowCount,
            paginationKey,
            cardViewMode = 'standard',
            onContextMenu,
            onEditCategory,
            onViewModeChange,
            onTagSelect,
            isLoggedIn,
          }: {
            category: import("./types/bookmark").Category;
            categoryBookmarks: Bookmark[];
            catIndex: number;
            isLiteMode: boolean | undefined;
            isInternal: boolean;
            totalBookmarkCount: number;
            collapseThreshold: number;
            initialShowCount: number;
            paginationKey: string;
            cardViewMode?: 'compact' | 'standard' | 'comfortable';
            onContextMenu: (e: React.MouseEvent, bookmark: Bookmark) => void;
            onEditCategory: (cat: import("./types/bookmark").Category) => void;
            onViewModeChange?: (mode: 'compact' | 'standard' | 'comfortable') => void;
            onTagSelect: (tag: string) => void;
            isLoggedIn?: boolean;
          }) {
            const configuredPageSize = Math.max(10, initialShowCount || 10);
            const paginationThreshold = collapseThreshold > 0
              ? Math.max(collapseThreshold, configuredPageSize)
              : configuredPageSize;
            const [pageSize, setPageSize] = useState(configuredPageSize);
            const [currentPage, setCurrentPage] = useState(1);

            useEffect(() => {
              setPageSize(configuredPageSize);
              setCurrentPage(1);
            }, [configuredPageSize]);

            // 标签筛选发生变化时，每个分类都从第一页重新开始。
            useEffect(() => {
              setCurrentPage(1);
            }, [paginationKey]);

            const needsPagination = categoryBookmarks.length > paginationThreshold;
            const totalPages = needsPagination
              ? Math.max(1, Math.ceil(categoryBookmarks.length / pageSize))
              : 1;
            const safeCurrentPage = Math.min(currentPage, totalPages);
            const pageStart = (safeCurrentPage - 1) * pageSize;
            const visibleBookmarks = needsPagination
              ? categoryBookmarks.slice(pageStart, pageStart + pageSize)
              : categoryBookmarks;

            // 删除当前页最后一项后，自动回到仍然有效的最后一页。
            useEffect(() => {
              setCurrentPage((previousPage) => Math.min(previousPage, totalPages));
            }, [totalPages]);

            // 懒渲染：前2个分类立即渲染，后续分类进入视口时才渲染
            const [lazyRef, shouldRender] = useLazyRender('300px');
            const isEager = catIndex < 2;
            const doRender = isEager || shouldRender;

            // 轻量模式：总书签超过 50 个时启用，减少 framer-motion 和 spotlight 开销
            const lightweight = totalBookmarkCount > 50;

            const scrollToCategory = useCallback(() => {
              window.requestAnimationFrame(() => {
                const section = document.getElementById(`category-${category.id}`);
                if (!section) return;

                const top = section.getBoundingClientRect().top + window.scrollY - 96;
                window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
              });
            }, [category.id]);

            const handlePageChange = useCallback((nextPage: number) => {
              setCurrentPage(nextPage);
              scrollToCategory();
            }, [scrollToCategory]);

            const handlePageSizeChange = useCallback((nextPageSize: number) => {
              setPageSize(nextPageSize);
              setCurrentPage(1);
              scrollToCategory();
            }, [scrollToCategory]);

            return (
              <motion.section
                id={`category-${category.id}`}
                ref={isEager ? undefined : lazyRef}
                className="mb-12 relative group scroll-mt-24"
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ delay: Math.min(1.2 + catIndex * 0.1, 1.8) }}
                data-category-id={category.id}
              >
                {/* 背景装饰文字 */}
                {!isLiteMode && (
                  <div
                    className="absolute -top-8 left-0 text-[120px] font-bold pointer-events-none select-none leading-none"
                    style={{ fontFamily: "Inter, sans-serif", color: "var(--color-text-muted)", opacity: 0.03 }}
                  >
                    {category.name}
                  </div>
                )}

                <div className="flex items-center gap-3 mb-6 relative z-10">
                  <div
                    className="w-8 h-8 rounded-lg flex items-center justify-center backdrop-blur-sm"
                    style={{ backgroundColor: `${category.color}15`, color: category.color }}
                  >
                    <IconRenderer icon={category.icon} className="w-4 h-4" />
                  </div>
                  <h2 className="text-xl font-medium tracking-wide" style={{ color: "var(--color-text-primary)" }}>
                    {category.name}
                  </h2>
                  <span className="text-sm tabular-nums" style={{ color: "var(--color-text-muted)" }}>
                    {categoryBookmarks.length}
                  </span>
                  {isLoggedIn && (
                    <button
                      onClick={() => onEditCategory(category)}
                      className="ml-2 p-1.5 rounded-lg opacity-0 group-hover:opacity-100 hover:bg-white/10 transition-all focus:opacity-100"
                      style={{ color: "var(--color-text-muted)" }}
                      title="编辑分类"
                    >
                      <Edit2 className="w-4 h-4" />
                    </button>
                  )}
                  {/* 视图切换已迁移到菜单栏 */}
                  {onViewModeChange ? null : null}
                </div>

                <SortableContext items={visibleBookmarks.map((bookmark) => bookmark.id)} strategy={rectSortingStrategy}>
                  <div className={`${VIEW_MODE_CONFIG[cardViewMode].gridClass} relative z-10`}>
                    {doRender ? visibleBookmarks.map((bookmark, index) => (
                      <MemoizedBookmarkItem
                        key={bookmark.id}
                        bookmark={bookmark}
                        index={index}
                        category={category}
                        isLiteMode={isLiteMode}
                        isInternal={isInternal}
                        lightweight={lightweight}
                        cardViewMode={cardViewMode}
                        onContextMenu={onContextMenu}
                        onTagSelect={onTagSelect}
                      />
                    )) : null}
                  </div>
                </SortableContext>

                {/* 骨架屏：懒渲染未激活时显示 */}
                {!doRender && (
                  <CategorySkeleton
                    count={Math.min(pageSize, categoryBookmarks.length)}
                    color={category.color || '#667eea'}
                    cardViewMode={cardViewMode}
                  />
                )}

                {doRender && needsPagination && (
                  <Pagination
                    page={safeCurrentPage}
                    pageSize={pageSize}
                    total={categoryBookmarks.length}
                    onPageChange={handlePageChange}
                    onPageSizeChange={handlePageSizeChange}
                  />
                )}
              </motion.section>
            );
          }
          '''

          source = source[:start] + new_section + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run pagination tests
        run: npm run test:run -- src/components/ui/__tests__/pagination.test.tsx

      - name: Build frontend
        run: npm run build

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --check
          git commit -m "feat(ui): paginate bookmark category lists"
          git push origin HEAD:feat/bookmark-list-pagination
