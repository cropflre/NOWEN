name: Web CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply staged homepage refactor
        run: |
          cat .github/phase4/part* | base64 -d | gzip -d > /tmp/phase4.diff
          patch --batch -p1 < /tmp/phase4.diff
          patch --batch -p1 < .github/phase4-fix.diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Publish verified refactor
        env:
          FINAL_WORKFLOW_B64: 
        run: |
          printf '%s' "$FINAL_WORKFLOW_B64" | base64 -d > .github/workflows/web-ci.yml
          rm -rf .github/phase4 .github/phase4-code.patch.gz.b64 .github/phase4-fix.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): add responsive bookmark library"
          git push origin HEAD:${{ github.head_ref }}
